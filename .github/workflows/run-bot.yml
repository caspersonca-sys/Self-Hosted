name: Run FNLB Bot 24/7

on:
  schedule:
    - cron: '0 */4 * * *' # Auto-restarts every 4 hours to clear GitHub's background timeouts
  workflow_dispatch: # Allows manual panel execution

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Prevents multiple cron instances from running simultaneously and breaking your bot session
    concurrency:
      group: fnlb-bot-session
      cancel-in-progress: true

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Bun JavaScript Engine
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Project Dependencies via Bun
        run: bun install

      - name: Launch FNLB Cluster Node
        env:
          FNLB_API_TOKEN: ${{ secrets.FNLB_API_TOKEN }}
          API_TOKEN: ${{ secrets.FNLB_API_TOKEN }} # Direct fallback mapping for cluster variables
        # 'timeout 14100s' cleanly terminates the Bun process after 3 hours and 55 minutes
        run: timeout 14100s bun run start || echo "Bot step reached scheduled rotation timeout. Restarting clean on next cycle."
