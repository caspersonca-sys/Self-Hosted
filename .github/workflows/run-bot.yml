name: Run FNLB Bot 24/7

on:
  workflow_dispatch: # Allows manual execution and self-triggering loops

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Ensures only one instance runs at a time if triggered manually during a run
    concurrency:
      group: fnlb-bot-session
      cancel-in-progress: false # Set to false so the next run waits or chains perfectly

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Bun JavaScript Engine
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Project Dependencies via Bun
        run: bun install

      - name: Launch FNLB Cluster Node
        env:
          FNLB_API_TOKEN: ${{ secrets.FNLB_API_TOKEN }}
          API_TOKEN: ${{ secrets.FNLB_API_TOKEN }} 
        # Keeps the bot running for 5 hours and 50 minutes (21000s), just under GitHub's 6-hour limit
        run: timeout 21000s bun run start || echo "Bot step reached scheduled rotation timeout."

      - name: Trigger Next Cycle Instantly
        if: always() # Ensures the bot triggers the next run even if it crashes or errors out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Launching next 24/7 cluster cycle..."
          gh workflow run "Run FNLB Bot 24/7" --ref ${{ github.ref_name }}
